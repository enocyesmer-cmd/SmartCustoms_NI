<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCustoms NI - Clientes</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="clientes">

<button class="btn-menu" id="btnMenu" aria-label="Abrir menú">Menú</button>

<div class="sidebar" id="menu"></div>

<div class="main">

<div class="header">
    <div>
        <h1>Clientes</h1>
        <p>Importadores y consignatarios para usar en las declaraciones</p>
    </div>
</div>

<div class="form-card" id="formCliente">
    <h2 id="tituloFormCliente">Nuevo cliente</h2>
    <div class="grid">
        <div>
            <label for="cCodigo">Código (consignatario)</label>
            <input type="text" id="cCodigo" >
        </div>
        <div>
            <label for="cNombre">Nombre / Razón social</label>
            <input type="text" id="cNombre" >
        </div>
        <div>
            <label for="cTipo">Tipo</label>
            <select id="cTipo">
                <option>Importador</option>
                <option>Consignatario</option>
                <option>Ambos</option>
            </select>
        </div>
        <div>
            <label for="cRuc">RUC</label>
            <input type="text" id="cRuc" >
        </div>
        <div>
            <label for="cTelefono">Teléfono</label>
            <input type="tel" id="cTelefono" >
        </div>
        <div>
            <label for="cCorreo">Correo</label>
            <input type="email" id="cCorreo" >
        </div>
        <div>
            <label for="cDireccion">Dirección</label>
            <input type="text" id="cDireccion" >
        </div>
    </div>
    <p id="errorCliente" class="error-texto"></p>
    <div class="botones izq">
        <button class="guardar" id="btnGuardarCliente">Guardar cliente</button>
        <button class="limpiar" id="btnLimpiarCliente">Limpiar</button>
    </div>
</div>

<div class="filtros">
    <label for="cBuscar">Buscar por código, nombre o RUC</label>
    <input type="text" id="cBuscar">
</div>

<div class="tabla">
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>RUC</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="listaClientes"></tbody>
    </table>
</div>

</div>

<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>
