<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCustoms NI - Iniciar Sesión</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="login" class="pagina-login">

<!-- burbujas de fondo, solo decoran -->
<span class="burbuja b1"></span>
<span class="burbuja b2"></span>
<span class="burbuja b3"></span>
<span class="burbuja b4"></span>

<div class="login-tarjeta">

    <!-- forma azul con borde ondulado; el formulario va encima -->
    <svg class="login-onda" viewBox="0 0 480 600" preserveAspectRatio="none" aria-hidden="true">
        <path d="M150 0 C 60 110, 230 190, 120 300 C 40 385, 150 470, 90 600 L 480 600 L 480 0 Z"/>
    </svg>

    <!-- lado izquierdo: marca e ilustracion -->
    <section class="login-marca">
        <img class="login-logo" src="img/logo-recortado.png" alt="SmartCustoms NI">

        <!-- contenedor, flujo de datos y recibo (dibujado con svg) -->
        <svg class="login-dibujo" viewBox="0 0 360 230" aria-hidden="true">
            <ellipse cx="180" cy="205" rx="130" ry="10" fill="#0b3d91" opacity=".08"/>
            <g class="flota">
                <!-- contenedor -->
                <path d="M30 70 L110 50 L110 160 L30 170 Z" fill="#0b3d91"/>
                <rect x="110" y="50" width="86" height="110" rx="3" fill="#fff" stroke="#0b3d91" stroke-width="5"/>
                <text x="153" y="116" text-anchor="middle" font-size="40" font-weight="800" fill="#0b3d91" font-family="Segoe UI, Arial, sans-serif">SC</text>
                <g stroke="#6f93d1" stroke-width="3" stroke-linecap="round">
                    <line x1="46" y1="82" x2="46" y2="158"/>
                    <line x1="62" y1="78" x2="62" y2="160"/>
                    <line x1="78" y1="74" x2="78" y2="162"/>
                    <line x1="94" y1="70" x2="94" y2="164"/>
                </g>
            </g>
            <!-- lineas que se mueven hacia el archivo -->
            <g class="flujo" stroke="#0b3d91" stroke-width="4" stroke-linecap="round" fill="none">
                <line x1="212" y1="84" x2="246" y2="84"/>
                <line x1="212" y1="104" x2="256" y2="104"/>
                <line x1="212" y1="124" x2="246" y2="124"/>
                <line x1="212" y1="144" x2="236" y2="144"/>
            </g>
            <g class="flota retraso">
                <!-- recibo -->
                <path d="M270 60 H312 L336 84 V150 a6 6 0 0 1 -6 6 H270 a6 6 0 0 1 -6 -6 V66 a6 6 0 0 1 6 -6 Z" fill="#fff" stroke="#0b3d91" stroke-width="5" stroke-linejoin="round"/>
                <path d="M312 60 V84 H336" fill="none" stroke="#0b3d91" stroke-width="5" stroke-linejoin="round"/>
                <text x="300" y="122" text-anchor="middle" font-size="19" font-weight="800" fill="#0b3d91" font-family="Segoe UI, Arial, sans-serif">DUA</text>
                <path d="M282 140 L292 150 L318 130" fill="none" stroke="#0b3d91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </svg>

        <h2 class="login-lema">Del dato al recibo en segundos.</h2>
        <p class="login-texto">Prepare, revise e imprima sus declaraciones aduaneras de forma rápida y precisa.</p>
    </section>

    <!-- lado derecho: formulario -->
    <section class="login-form">
        <h1>Iniciar Sesión</h1>
        <p class="login-sub">Ingrese con su usuario</p>

        <!-- el envio lo maneja js/login.js -->
        <form id="formLogin" autocomplete="on">
            <label for="usuario">Usuario</label>
            <div class="campo-login">
                <i data-ico="users"></i>
                <input type="text" id="usuario" maxlength="30" placeholder="Escriba su usuario" autocomplete="username" autofocus>
            </div>

            <label for="clave">Contraseña</label>
            <div class="campo-login">
                <i data-ico="shield"></i>
                <input type="password" id="clave" maxlength="64" placeholder="Escriba su contraseña" autocomplete="current-password">
                <button type="button" id="verClave" class="ojo" aria-label="Mostrar contraseña"><i data-ico="eye"></i></button>
            </div>

            <p id="errorLogin" class="error-texto"></p>

            <button type="submit" class="btn-entrar">Entrar</button>
        </form>

    </section>

    <p class="login-pie">SmartCustoms NI © 2026</p>
</div>

<script src="js/datos.js"></script>
<script src="js/iconos.js"></script>
<script src="js/login.js"></script>
</body>
</html>
